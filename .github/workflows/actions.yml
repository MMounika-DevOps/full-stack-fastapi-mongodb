name: build and deploy template

on:
  push:
    branches:
      - main
      - production

env:
  TRAEFIK_PUBLIC_NETWORK: traefik-public
  STACK_NAME: localhost-tiangolo-com
  DOCKER_IMAGE_CELERYWORKER: celeryworker
  TRAEFIK_TAG: localhost.tiangolo.com
  TRAEFIK_PUBLIC_TAG: traefik-public
  DOCKER_IMAGE_BACKEND: backend
  DOCKER_IMAGE_FRONTEND: frontend
  PROJECT_NAME: Full Stack FastAPI MongoDB
  DOMAIN: localhost
  SMTP_HOST: ""

jobs:

  # ============================================================
  # TESTS
  # ============================================================
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Create test environment
        run: |
          cat > .env <<'EOF'
          DOMAIN=localhost
          ENVIRONMENT=local
          PROJECT_NAME="Full Stack FastAPI MongoDB"
          STACK_NAME=localhost-tiangolo-com
          SECRET_KEY=test-secret-key
          BACKEND_CORS_ORIGINS=http://localhost,http://localhost:5173
          FIRST_SUPERUSER=admin@example.com
          FIRST_SUPERUSER_PASSWORD=testpassword
          USERS_OPEN_REGISTRATION=False
          MONGO_DATABASE_URI=mongodb://mongodb:27017
          MONGO_DATABASE=app
          SMTP_HOST=
          SMTP_USER=
          SMTP_PASSWORD=
          EMAILS_FROM_EMAIL=info@example.com
          SMTP_TLS=False
          EOF

      - name: Verify test environment
        run: |
          echo ".env created successfully"
          test -f .env
          echo ".env file exists"

      - name: Run Tests
        run: |
          chmod +x ./scripts/test.sh
          DOMAIN=backend sh ./scripts/test.sh


  # ============================================================
  # STAGING
  # ============================================================
  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Create staging environment
        run: |
          cat > .env <<'EOF'
          DOMAIN=stag.localhost.tiangolo.com
          ENVIRONMENT=staging
          PROJECT_NAME="Full Stack FastAPI MongoDB"
          STACK_NAME=stag-localhost-tiangolo-com
          SECRET_KEY=staging-test-secret-key
          BACKEND_CORS_ORIGINS=https://stag.localhost.tiangolo.com
          FIRST_SUPERUSER=admin@example.com
          FIRST_SUPERUSER_PASSWORD=testpassword
          USERS_OPEN_REGISTRATION=False
          MONGO_DATABASE_URI=mongodb://mongodb:27017
          MONGO_DATABASE=app
          SMTP_HOST=
          SMTP_USER=
          SMTP_PASSWORD=
          EMAILS_FROM_EMAIL=info@example.com
          SMTP_TLS=False
          EOF

      - name: Verify staging environment
        run: |
          echo ".env created successfully for staging"
          test -f .env
          echo "Checking important environment variables..."
          grep "^DOMAIN=" .env
          grep "^STACK_NAME=" .env
          echo "Staging environment ready"

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install docker-auto-labels
        run: |
          pip install docker-auto-labels

      - name: Build Staging
        run: |
          DOMAIN=stag.localhost.tiangolo.com \
          TRAEFIK_TAG=stag.localhost.tiangolo.com \
          STACK_NAME=stag-localhost-tiangolo-com \
          TAG=staging \
          FRONTEND_ENV=staging \
          sh ./scripts/build-push.sh

      # Uncomment only when staging deployment server is ready
      #
      # - name: Deploy Staging
      #   run: |
      #     DOMAIN=stag.localhost.tiangolo.com \
      #     TRAEFIK_TAG=stag.localhost.tiangolo.com \
      #     STACK_NAME=stag-localhost-tiangolo-com \
      #     TAG=staging \
      #     sh ./scripts/deploy.sh


  # ============================================================
  # PRODUCTION
  # ============================================================
  deploy-prod:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Create production environment
        run: |
          cat > .env <<'EOF'
          DOMAIN=localhost.tiangolo.com
          ENVIRONMENT=production
          PROJECT_NAME="Full Stack FastAPI MongoDB"
          STACK_NAME=localhost-tiangolo-com
          SECRET_KEY=production-test-secret-key
          BACKEND_CORS_ORIGINS=https://localhost.tiangolo.com
          FIRST_SUPERUSER=admin@example.com
          FIRST_SUPERUSER_PASSWORD=testpassword
          USERS_OPEN_REGISTRATION=False
          MONGO_DATABASE_URI=mongodb://mongodb:27017
          MONGO_DATABASE=app
          SMTP_HOST=
          SMTP_USER=
          SMTP_PASSWORD=
          EMAILS_FROM_EMAIL=info@example.com
          SMTP_TLS=False
          EOF

      - name: Verify production environment
        run: |
          echo ".env created successfully for production"
          test -f .env
          echo "Checking important environment variables..."
          grep "^DOMAIN=" .env
          grep "^STACK_NAME=" .env
          echo "Production environment ready"

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install docker-auto-labels
        run: |
          pip install docker-auto-labels

      - name: Build Production
        run: |
          DOMAIN=localhost.tiangolo.com \
          TRAEFIK_TAG=localhost.tiangolo.com \
          STACK_NAME=localhost-tiangolo-com \
          TAG=prod \
          FRONTEND_ENV=production \
          sh ./scripts/build-push.sh

      # Uncomment only when production deployment server is ready
      #
      # - name: Deploy Production
      #   run: |
      #     DOMAIN=localhost.tiangolo.com \
      #     TRAEFIK_TAG=localhost.tiangolo.com \
      #     STACK_NAME=localhost-tiangolo-com \
      #     TAG=prod \
      #     sh ./scripts/deploy.sh
